name: V7 HTTPS delivery lab
on:
  workflow_dispatch:
  push:
    branches: ['feature/signature-v7-design','feature/v7.1-refinement']
    paths:
      - 'scripts/v7_https_lab.cjs'
      - 'scripts/build_v7.py'
      - 'assets/v7.css'
      - '.github/workflows/v7-https-lab.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run HTTPS HTTP2 Brotli mobile comparison
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lh" --no-audit --no-fund lighthouse@13.5.0
          git worktree add --detach "$RUNNER_TEMP/v6-baseline" cce32e0bdbb7b133f09ee4d641cfc521aaf975b3
          mkdir -p "$RUNNER_TEMP/https-lab"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/lab.key" -out "$RUNNER_TEMP/lab.crt" -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1
          node scripts/v7_https_lab.cjs "$RUNNER_TEMP/v6-baseline" 18783 "$RUNNER_TEMP/lab.key" "$RUNNER_TEMP/lab.crt" normal &
          a=$!
          node scripts/v7_https_lab.cjs "$GITHUB_WORKSPACE" 18784 "$RUNNER_TEMP/lab.key" "$RUNNER_TEMP/lab.crt" normal &
          b=$!
          trap 'kill "$a" "$b" 2>/dev/null || true' EXIT
          sleep 2
          for port in 18783 18784; do curl -kfsS --compressed "https://127.0.0.1:$port/" >/dev/null; done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          lh="$RUNNER_TEMP/lh/node_modules/.bin/lighthouse"
          for i in 1 2 3; do
            if [ "$i" = 2 ]; then order="v7 v6"; else order="v6 v7"; fi
            for label in $order; do
              case "$label" in v6) port=18783;; v7) port=18784;; bundle) port=18785;; esac
              "$lh" "https://127.0.0.1:$port/" --quiet --chrome-flags="--headless --no-sandbox --disable-gpu --ignore-certificate-errors" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="$RUNNER_TEMP/https-lab/$label-$i.json"
            done
          done
          python3 - <<'PY'
          import json, os, pathlib, statistics
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'https-lab'; result={}
          for label in ('v6','v7'):
              rows=[]
              for f in sorted(p.glob(label+'-*.json')):
                  d=json.loads(f.read_text()); a=d['audits']
                  r={k:round(v['score']*100) for k,v in d['categories'].items()}
                  r.update(lcp_ms=round(a['largest-contentful-paint']['numericValue']),tbt_ms=round(a['total-blocking-time']['numericValue']),cls=round(a['cumulative-layout-shift']['numericValue'],5))
                  req=a['network-requests']['details']['items']
                  r.update(css_requests=sum(x.get('resourceType')=='Stylesheet' for x in req),css_bytes=sum(x.get('transferSize',0) for x in req if x.get('resourceType')=='Stylesheet'))
                  assert any(x.get('protocol')=='h2' for x in req), 'HTTP/2 not observed'
                  rows.append(r)
              assert len(rows)==3
              med={k:statistics.median(r[k] for r in rows) for k in rows[0]}
              result[label]={'runs':rows,'median':med,'performance_gate':'PASS' if med['performance']>=95 and med['lcp_ms']<=2500 and med['cls']<=.1 else 'FAIL'}
          (p/'summary.json').write_text(json.dumps(result,indent=2))
          print('HTTPS_LAB '+json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## HTTPS lab\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-https-lab
          path: ${{ runner.temp }}/https-lab/
          retention-days: 14
