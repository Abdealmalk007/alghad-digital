name: Refresh Arabic and Official Technology News
on:
  workflow_dispatch:
  schedule:
    # Asia/Riyadh is UTC+3 all year. GitHub scheduled workflows are best-effort
    # and have been observed starting 7+ hours late. Redundant triggers reduce
    # missed daily snapshots; no individual cron guarantees an exact start time.
    - cron: "30 4 * * *"   # Main target: 07:30 Riyadh
    - cron: "17 5 * * *"   # Backup: 08:17 Riyadh
    - cron: "47 7 * * *"   # Backup: 10:47 Riyadh
    - cron: "13 11 * * *"  # Backup: 14:13 Riyadh

permissions:
  contents: write

concurrency:
  group: refresh-arabic-tech-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out public website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect and verify public RSS headlines
        run: python scripts/update_news.py
      - name: Fetch original news releases from official technology and car makers
        run: python scripts/update_industry_news.py
      - name: Translate new English news headlines into Arabic with cached results
        run: python scripts/translate_news.py
      - name: Report source freshness and recorded publication dates
        run: python scripts/news_health_report.py
      - name: Prerender software, safe release links, and a short news digest
        run: python scripts/prerender_home.py
      - name: Rebuild canonical pages and sitemap
        run: python scripts/build_seo.py
      - name: Generate factual security, about and privacy pages
        run: python scripts/build_support_pages.py
      - name: Build complete English edition and bilingual sitemap
        run: python scripts/build_en.py
      - name: Add crawlable software and topic tags to both languages
        run: python scripts/build_topic_tags.py
      - name: Build software benefit sections and email-only support links
        run: python scripts/build_program_experience.py
      - name: Refresh sitewide search over pages, software and latest news
        run: python scripts/build_site_search.py
      - name: Verify indexable pages and editorial integrity
        run: |
          python scripts/test_seo.py
          node tests/bilingual-test.cjs
          node tests/editorial-test.cjs
          node tests/favicon-test.cjs
          node tests/industry-news-test.cjs
          node tests/translation-test.cjs
          node tests/product-first-test.cjs
          node tests/brand-seo-test.cjs
          node tests/no-duplicate-program-test.cjs
          node tests/share-download-test.cjs
          node tests/two-actions-test.cjs
          node tests/program-documentation-test.cjs
          node tests/site-search-test.cjs
          node tests/topic-tags-test.cjs
          node tests/program-experience-test.cjs
          node tests/windows-office-sources-test.cjs
          node tests/news-refresh-reliability-test.cjs
      - name: Validate generated news data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("assets/news.json").read_text(encoding="utf-8"))
          assert len(data["articles"]) >= 5
          assert all(a["url"].startswith("https://") for a in data["articles"])
          print("Verified",len(data["articles"]),"attributed headlines")
          PY
      - name: Commit snapshot when headlines change
        run: |
          git config user.name "alghad-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/news.json assets/news-data.js news/index.html sitemap.xml index.html
          git add -- en/
          git add -- docs/programs/ programs/
          git add -- about/index.html security/index.html privacy/index.html protech/index.html
          git add -- assets/release-facts-data.js
          git add -- assets/industry-news.json assets/industry-news-data.js
          git add -- assets/translation-cache.json
          git add -- assets/site-search-index.js
          git add -- ai-news/index.html tech-companies/index.html cars/index.html
          # Also stage changed tracked output from new site generators before rebase.
          # The workflow starts from a clean checkout; -u excludes untracked artifacts.
          git add -u
          if git diff --cached --quiet; then
            echo "News snapshot unchanged."
            exit 0
          fi
          git commit -m "content: refresh secondary news and primary software landing pages"
          git pull --rebase origin main
          git push origin HEAD:main
