<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Original Microsoft PowerToys application icon on an ALGHAD DIGITAL preview card">
  <title>Microsoft PowerToys — official application icon</title>
  <desc>Original publisher logo shown on a customized background. Logo rights remain with its publisher.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#1b4c7f"/><stop offset="1" stop-color="#161b44"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9abaff" stop-opacity=".24"/><stop offset="1" stop-color="#9abaff" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".30"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#back)"/>
  <circle cx="745" cy="115" r="330" fill="url(#glow)"/>
  <g stroke="#9abaff" stroke-width="1" opacity=".09"><path d="M0 108H960M0 216H960M0 324H960M0 432H960M160 0V540M320 0V540M480 0V540M640 0V540M800 0V540"/></g>
  <rect x="311" y="57" width="338" height="354" rx="48" fill="#061725" fill-opacity=".40" stroke="#9abaff" stroke-opacity=".32"/>
  <image x="318" y="81" width="324" height="324" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
  <text x="52" y="478" fill="#f4faff" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="2">MICROSOFT POWERTOYS</text>
  <text x="909" y="479" fill="#9abaff" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="end" letter-spacing="1">OFFICIAL APP ICON</text>
</svg>
